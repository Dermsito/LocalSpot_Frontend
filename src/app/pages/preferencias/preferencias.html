<div class="pantalla-wrapper">
  <div class="card-preferencias">
    <h2>¿Qué te interesa encontrar?</h2>
    <p class="subtitulo">Selecciona al menos una categoría para personalizar tus búsquedas</p>

    <div class="grid-categorias">
      <div 
        *ngFor="let cat of categorias" 
        class="card-categoria" 
        [class.selected]="cat.seleccionada"
        (click)="toggleCategoria(cat)">
        <span class="icono">{{ cat.icono }}</span>
        <p class="nombre-cat">{{ cat.nombre }}</p>
      </div>
    </div>

    <button class="btn-guardar" (click)="guardarYContinuar()">
      Guardar y Continuar
    </button>
  </div>
</div>
