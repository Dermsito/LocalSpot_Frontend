<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-emoji">📍</div>
      <h1>LocalSpot</h1>
      <p>Crea una cuenta para comenzar a explorar</p>
    </div>

    <form (ngSubmit)="onRegistro()" class="login-form">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          [(ngModel)]="nuevoUsuario.nombre"
          name="nombre"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          [(ngModel)]="nuevoUsuario.correo"
          name="correo"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="nuevoUsuario.password"
          name="password"
          placeholder="Mínimo 8 caracteres"
          minlength="8"
          required
        />
      </div>

      <p class="form-error" *ngIf="error" style="color:#c53030;background:#fff5f5;border:1px solid #feb2b2;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;margin:0;">
        {{ error }}
      </p>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        {{ cargando ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="divider">
      <span>o regístrate con</span>
    </div>

    <div class="google-btn-container">
      <div #googleBtn class="google-btn-wrapper"></div>
    </div>

    <div class="login-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
