<div class="admin-wrapper">
  <div class="admin-card">
    <div class="admin-header">
      <div class="admin-badge">🛡️</div>
      <span class="admin-tag">Panel de administración</span>
      <h1>LocalSpot Admin</h1>
      <p>Acceso exclusivo para administradores de establecimientos.</p>
    </div>

    <form (ngSubmit)="onLoginAdmin()" class="admin-form">
      <div class="form-group">
        <label for="correo">Correo corporativo</label>
        <input
          type="email"
          id="correo"
          [(ngModel)]="credenciales.correo"
          name="correo"
          placeholder="admin@tunegocio.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="credenciales.password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <p class="form-error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn-admin" [disabled]="cargando">
        {{ cargando ? 'Verificando…' : 'Entrar al panel' }}
      </button>
    </form>

    <div class="admin-footer">
      <p>¿Aún no tienes cuenta de administrador? <a routerLink="/admin/registro">Registra tu negocio</a></p>
      <p class="client-link"><a routerLink="/login">← Volver al acceso de clientes</a></p>
    </div>
  </div>
</div>
