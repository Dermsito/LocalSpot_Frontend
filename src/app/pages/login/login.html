<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-emoji">📍</div>
      <h1>LocalSpot</h1>
      <p>Inicia sesión para explorar los mejores lugares</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input 
          type="email" 
          id="correo"
          [(ngModel)]="credenciales.correo" 
          name="correo" 
          placeholder="ejemplo@correo.com" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="credenciales.password" 
          name="password" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <p class="form-error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="login-footer">
      <p>¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
      <p class="admin-access">¿Tienes un negocio? <a routerLink="/propietario/login">Acceso propietario</a></p>
    </div>
  </div>
</div>
