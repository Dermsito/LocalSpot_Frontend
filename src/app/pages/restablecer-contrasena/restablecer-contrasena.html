<div class="restablecer-wrapper">
  <div class="restablecer-card">
    <div class="restablecer-header">
      <div class="logo-emoji">🔑</div>
      <h1>Nueva Contraseña</h1>
      <p>Elige tu nueva contraseña de acceso para LocalSpot.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="restablecer-form" *ngIf="!mensajeExito">
      <div class="form-group">
        <label for="nuevaContrasena">Nueva contraseña</label>
        <input 
          type="password" 
          id="nuevaContrasena"
          [(ngModel)]="nuevaContrasena" 
          name="nuevaContrasena" 
          placeholder="Mínimo 6 caracteres" 
          required 
          [disabled]="cargando || !token"
        />
      </div>

      <div class="form-group">
        <label for="confirmarContrasena">Confirmar nueva contraseña</label>
        <input 
          type="password" 
          id="confirmarContrasena"
          [(ngModel)]="confirmarContrasena" 
          name="confirmarContrasena" 
          placeholder="Repite tu nueva contraseña" 
          required 
          [disabled]="cargando || !token"
        />
      </div>

      <p class="form-error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn-submit" [disabled]="cargando || !token">
        {{ cargando ? 'Restableciendo...' : 'Guardar nueva contraseña' }}
      </button>
    </form>

    <div class="estado-exito" *ngIf="mensajeExito">
      <div class="icono-check">🎉</div>
      <h3>¡Contraseña actualizada!</h3>
      <p>{{ mensajeExito }}</p>
      <a routerLink="/login" class="btn-ingresar">Iniciar sesión ahora</a>
    </div>

    <div class="restablecer-footer" *ngIf="!mensajeExito">
      <p><a routerLink="/recuperar-contrasena">Solicitar un nuevo enlace</a></p>
    </div>
  </div>
</div>
